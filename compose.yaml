# Локальное окружение всей системы: `docker compose up -d`.
# Образы бэкенда берутся из GHCR; собрать из ../backend: `make up-local`.
# Только для разработки: пароли здесь тестовые.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: autocheck
      POSTGRES_PASSWORD: autocheck
      POSTGRES_DB: autocheck
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocheck -d autocheck"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SeaweedFS в режиме «всё в одном»: master + volume + filer + S3-шлюз.
  # Для прода компоненты разносятся по отдельным контейнерам.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports: ["8333:8333", "9333:9333"]
    volumes:
      - seaweeddata:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Keycloak: вход, регистрация, роли (student/author/admin). Realm импортируется
  # из deploy/keycloak при первом старте. Админка: http://localhost:8180 (admin/admin).
  # KC_HOSTNAME фиксирует issuer токенов как http://localhost:8180/realms/autocheck,
  # чтобы он совпадал и для браузера, и для бэкенда внутри compose.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2-2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["8180:8080"]
    volumes:
      - keycloakdata:/opt/keycloak/data
      - ./deploy/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # В образе нет curl, поэтому проверка через /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  migrate:
    image: ghcr.io/autocheck-team/backend-migrate:${BACKEND_TAG:-latest}
    command: ["up"]
    environment: &backend-env
      METRICS_ADDR: ":9100"
      DATABASE_URL: postgres://autocheck:autocheck@postgres:5432/autocheck?sslmode=disable
      S3_ENDPOINT: seaweedfs:8333
      # Адрес хранилища для браузера: на него выписываются presigned-ссылки на загрузку тестов.
      S3_PUBLIC_ENDPOINT: localhost:8333
      S3_BUCKET: autocheck
      S3_ACCESS_KEY: autocheck
      S3_SECRET_KEY: autocheck-secret
      OIDC_ISSUER: http://localhost:8180/realms/autocheck
      OIDC_JWKS_URL: http://keycloak:8080/realms/autocheck/protocol/openid-connect/certs
      OIDC_AUDIENCE: autocheck-api
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # Тестовый магазин ЮKassa берётся из .env рядом с compose.yaml (в git не попадает).
      # Без ключей оформление подписки выключено, лимиты бесплатного тарифа действуют.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }

  api:
    image: ghcr.io/autocheck-team/backend-api:${BACKEND_TAG:-latest}
    environment: *backend-env
    ports: ["8080:8080", "9090:9090"]
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Воркер запускает решения в соседних контейнерах через Docker API. Доступ к сокету
  # равносилен root на хосте, поэтому код студентов выполняется только в песочницах,
  # а не в самом воркере. Сокет принадлежит root, отсюда user: root.
  worker:
    image: ghcr.io/autocheck-team/backend-worker:${BACKEND_TAG:-latest}
    user: root
    restart: on-failure
    environment: *backend-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      migrate: { condition: service_completed_successfully }

  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: [monitoring]
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.retention.time=7d"]
    ports: ["127.0.0.1:${PROMETHEUS_PORT:-9091}:9090"]
    volumes:
      - ./deploy/monitoring/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheusdata:/prometheus
    depends_on: [api, worker]

  grafana:
    image: grafana/grafana:12.3.0
    profiles: [monitoring]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["127.0.0.1:${GRAFANA_PORT:-3000}:3000"]
    volumes:
      - grafanadata:/var/lib/grafana
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, loki]

  # Named volume создаётся root; выдаём его штатному non-root UID Loki.
  monitoring-init:
    image: busybox:1.37.0
    profiles: [monitoring]
    user: "0:0"
    network_mode: none
    command: ["chown", "10001:10001", "/loki"]
    volumes:
      - lokidata:/loki

  loki:
    image: grafana/loki:3.6.0
    profiles: [monitoring]
    command: ["-config.file=/etc/loki/config.yaml"]
    ports: ["127.0.0.1:${LOKI_PORT:-3100}:3100"]
    volumes:
      - ./deploy/monitoring/loki.yaml:/etc/loki/config.yaml:ro
      - lokidata:/loki
    depends_on:
      monitoring-init: { condition: service_completed_successfully }

  # Docker API нужен для discovery и чтения stdout; sandbox-контейнеры исключены.
  alloy:
    image: grafana/alloy:v1.11.3
    profiles: [monitoring]
    user: root
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deploy/monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - alloydata:/var/lib/alloy/data
    depends_on: [loki]

volumes:
  prometheusdata:
  grafanadata:
  lokidata:
  alloydata:
  keycloakdata:
  pgdata:
  seaweeddata:
